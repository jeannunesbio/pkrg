name: PokeRogue R36S - build ARM64 experimental

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-r36s:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v5

      - name: Install ARM64 build dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = 'aarch64'
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential cmake pkg-config git curl unzip ca-certificates \
            libsdl2-dev libfaad-dev libcurl4-openssl-dev libssl-dev \
            libgles2-mesa-dev libegl1-mesa-dev

      - name: Fetch upstream PokeRogue Vita source and dependencies
        shell: bash
        run: |
          set -euo pipefail
          git init -q upstream
          git -C upstream remote add origin https://github.com/krappaU/pokerogue-vita.git
          git -C upstream fetch --depth 1 origin ddb27da6bc2260bcc009c80f1fea87ec18bd88c8
          git -C upstream checkout -q --detach FETCH_HEAD
          git -C upstream rev-parse HEAD > UPSTREAM_COMMIT.txt
          cd upstream/runtime
          bash scripts/fetch_deps.sh

      - name: Patch R36S controls - fix stuck Enter during OSK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'R36S_PATCH_PY'
          from pathlib import Path
          p = Path("upstream/runtime/src/platform_sdl.c")
          s = p.read_text(encoding="utf-8")
          anchor = "static SDL_GameController *pads[4];\n"
          helper = """static SDL_Keycode r36s_keyboard_for_button(Uint8 button) {
              // R36S dArkOSRE: translate SDL game controller events to the game's keyboard controls.
              switch (button) {
              case SDL_CONTROLLER_BUTTON_A: return SDLK_RETURN;       // confirm (key up must always be dispatched)
              case SDL_CONTROLLER_BUTTON_B: return SDLK_BACKSPACE;   // cancel
              case SDL_CONTROLLER_BUTTON_X: return SDLK_n;           // starter: nature
              case SDL_CONTROLLER_BUTTON_Y: return SDLK_v;           // enemy details / variants
              case SDL_CONTROLLER_BUTTON_DPAD_UP: return SDLK_UP;
              case SDL_CONTROLLER_BUTTON_DPAD_DOWN: return SDLK_DOWN;
              case SDL_CONTROLLER_BUTTON_DPAD_LEFT: return SDLK_LEFT;
              case SDL_CONTROLLER_BUTTON_DPAD_RIGHT: return SDLK_RIGHT;
              case SDL_CONTROLLER_BUTTON_LEFTSHOULDER: return SDLK_f;  // starter form
              case SDL_CONTROLLER_BUTTON_RIGHTSHOULDER: return SDLK_r; // starter shiny
              case SDL_CONTROLLER_BUTTON_BACK: return SDLK_LSHIFT;    // stats details
              case SDL_CONTROLLER_BUTTON_START: return SDLK_ESCAPE;   // main menu
              case SDL_CONTROLLER_BUTTON_LEFTSTICK: return SDLK_EQUALS; // speed up
              case SDL_CONTROLLER_BUTTON_RIGHTSTICK: return SDLK_MINUS; // speed down
              default: return SDLK_UNKNOWN;
              }
          }
          """
          assert s.count(anchor) == 1, "Ponto de insercao do mapeamento nao encontrado. Upstream mudou."
          # Track mapped press state so OSK cannot leave a held key in the app.
          helper += "\nstatic bool r36s_buttons_down[SDL_CONTROLLER_BUTTON_MAX] = {false};\n"
          s = s.replace(anchor, anchor + "\n" + helper, 1)
          needle = "        case SDL_MOUSEBUTTONDOWN:\n"
          controller_handler = """        case SDL_CONTROLLERBUTTONDOWN:
                  case SDL_CONTROLLERBUTTONUP: {
                      // SAFETY: never drop key-up when the on-screen keyboard opens.
                      // v4 suppressed *both* down and up during OSK. If A/Enter down
                      // opens OSK, its matching up was suppressed -> stuck Enter,
                      // repeated submit and HTTP 429. OSK still receives native SDL buttons.
                      bool osk = osk_active();
                      Uint8 button = e.cbutton.button;
                      if (button >= SDL_CONTROLLER_BUTTON_MAX) continue;
                      if (e.type == SDL_CONTROLLERBUTTONDOWN) {
                          if (osk) continue; // OSK owns presses while visible.
                          if (r36s_buttons_down[button]) continue; // no repeat downs.
                          r36s_buttons_down[button] = true;
                      } else {
                          // Release is critical EVEN when OSK is active.
                          // An unpaired 'up' is harmless to the game's keyboard shim.
                          r36s_buttons_down[button] = false;
                      }
                      SDL_Keycode k = r36s_keyboard_for_button(button);
                      if (k == SDLK_UNKNOWN || !map_key(k, ev)) continue;
                      ev->type = (e.type == SDL_CONTROLLERBUTTONDOWN) ? PEV_KEY_DOWN : PEV_KEY_UP;
                      host_log("[r36s-input-v5] %s button=%u -> %s osk=%d ticks=%u",
                               ev->type == PEV_KEY_DOWN ? "DOWN" : "UP",
                               (unsigned)button, ev->code, osk ? 1 : 0,
                               (unsigned)SDL_GetTicks());
                      return true;
                  }
          """
          assert s.count(needle) == 1, "Ponto de insercao de eventos nao encontrado. Upstream mudou."
          s = s.replace(needle, controller_handler + needle, 1)
          p.write_text(s, encoding="utf-8")
          
          # The native SDL gamepad continues to work for OSK and the host launcher.
          # Inside the browser shim expose only keyboard input to avoid double-presses in Phaser.
          p = Path("upstream/runtime/js/input.js")
          s = p.read_text(encoding="utf-8")
          needle = "rt.frameHooks.push(() => { padSnapshot = pollPads(); });"
          assert s.count(needle) == 1, "A API do gamepad mudou no upstream. Revisar antes de compilar."
          s = s.replace(needle,
              'rt.frameHooks.push(() => { padSnapshot = [null, null, null, null]; }); // R36S: SDL buttons -> DOM keyboard', 1)
          p.write_text(s, encoding="utf-8")
          print("R36S patch: SDL controller-to-keyboard enabled; in-game JS gamepad suppressed; OSK preserved.")
          R36S_PATCH_PY

      - name: Build native Linux ARM64 runtime
        shell: bash
        run: |
          set -euo pipefail
          cmake -S upstream/runtime -B upstream/runtime/build-r36s \
            -DCMAKE_BUILD_TYPE=Release -DPKR_DEBUG=ON -DPKR_COMMIT="$(cat UPSTREAM_COMMIT.txt)"
          cmake --build upstream/runtime/build-r36s --parallel 4
          file upstream/runtime/build-r36s/pokerogue-rt
          readelf -h upstream/runtime/build-r36s/pokerogue-rt | grep -E 'Class:|Machine:'

      - name: Package launchers and native runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/ports/pokerogue-r36s/lib package/ports/pokerogue-r36s/data
          test -f upstream/runtime/js/bootstrap.js
          cp upstream/runtime/build-r36s/pokerogue-rt package/ports/pokerogue-r36s/
          cp -a upstream/runtime/js package/ports/pokerogue-r36s/
          cp upstream/LICENSE package/ports/pokerogue-r36s/LICENSE-UPSTREAM-AGPL3.txt
          cp UPSTREAM_COMMIT.txt package/ports/pokerogue-r36s/
          cat > 'package/ports/PokeRogue 4 - Teste Boot.sh' <<'POKEROGUE_BOOT_EOF'
          #!/bin/bash
          # SPDX-License-Identifier: AGPL-3.0-only
          # Tempo de execucao limitado: diagnostico de inicializacao, NAO jogo completo.
          set -u
          HERE="$(CDPATH='' cd -- "$(dirname -- "$0")" && pwd -P)"
          APP="$HERE/pokerogue-r36s"
          LOG="$HERE/pokerogue-r36s-boot-v3.txt"
          mkdir -p "$APP/data"
          if [ ! -f "$APP/data/config.txt" ]; then
          cat > "$APP/data/config.txt" <<'CONF'
          # Configuracao inicial do teste: o teclado embutido evita entrada via PC.
          online=1
          osk=1
          fps30=1
          audio=0
          log=1
          CONF
          fi
          {
            echo '==== PokeRogue R36S / Teste Boot V3 ===='
            date -u '+Data UTC: %F %T' 2>/dev/null || true
            uname -rm
            echo 'Versao e instalacao:'
            head -c 80 "$APP/UPSTREAM_COMMIT.txt" 2>/dev/null || true
            echo
            if [ ! -x "$APP/pokerogue-rt" ]; then
              echo 'ERRO: pokerogue-rt ausente. Use primeiro o pacote ARM64 gerado pelo GitHub Actions.'
              exit 126
            fi
            if [ ! -f "$APP/js/bootstrap.js" ]; then
              echo 'ERRO: js/bootstrap.js ausente.'
              exit 126
            fi
            export SDL_VIDEODRIVER=kmsdrm
            export LD_LIBRARY_PATH="$APP/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            export SDL_GAMECONTROLLER_ALLOW_BACKGROUND_EVENTS=1
            echo 'Conferindo bibliotecas:'
            if command -v ldd >/dev/null 2>&1; then ldd "$APP/pokerogue-rt" | grep -E 'not found|libfaad|libSDL2|libcurl|libGLES' || true; fi
            echo 'Inicio do runtime (limite de seguranca 180 segundos)...'
            cd "$APP" || exit 1
            if command -v timeout >/dev/null 2>&1; then
              timeout --signal=TERM --kill-after=5s 180s ./pokerogue-rt --js "$APP/js" --data "$APP/data" --size 640x480
              status=$?
            else
              ./pokerogue-rt --js "$APP/js" --data "$APP/data" --size 640x480
              status=$?
            fi
            echo "runtime_exit=$status"
            if [ "$status" -eq 124 ]; then echo 'Observacao: limite de 180 s do teste atingido; nao significa erro do jogo.'; fi
            echo '==== FIM TESTE BOOT ===='
            exit "$status"
          } > "$LOG" 2>&1
          POKEROGUE_BOOT_EOF
          chmod 755 'package/ports/PokeRogue 4 - Teste Boot.sh'
          # V5: 180-s keyboard test. DO NOT ATTEMPT TO LOG IN during this test.
          cp 'package/ports/PokeRogue 4 - Teste Boot.sh' 'package/ports/PokeRogue 6 - Teste Teclado.sh'
          sed -i \
            -e 's@pokerogue-r36s-boot-v3.txt@pokerogue-r36s-teclado-v5.txt@g' \
            -e 's@Teste Boot V3@Teste Teclado V5@g' \
            'package/ports/PokeRogue 6 - Teste Teclado.sh'
          chmod 755 'package/ports/PokeRogue 6 - Teste Teclado.sh'
          cat > 'package/ports/pokerogue-r36s/CONTROLES-R36S-V5.txt' <<'EOF_R36S_KEYS'
          Teste seguro de teclado R36S V5 / dArkOSRE
          ------------------------------------
          Direcional: setas
          Botao A: confirmar (Enter)
          Botao B: cancelar (Backspace)
          Start: menu (Esc)
          Select: detalhes (Shift)
          X: Natureza (N) nos iniciais
          Y: Informacoes inimigas/variantes (V)
          L1: formas (F)
          R1: shiny (R)
          L3: velocidade + (=)
          R3: velocidade - (-)

          LOGIN: NAO DIGITE SENHA NEM TENTE SE AUTENTICAR NA V5.
          Teste o campo do usuario, abra o teclado virtual e use Select para cancelar.
          No teclado virtual: A seleciona tecla, B apaga, Start confirma e Select cancela.
          A V5 preserva a soltura do Enter mesmo com o teclado virtual aberto.

          O log de teste e ports/pokerogue-r36s-teclado-v5.txt.
          Procure linhas [r36s-input-v5] DOWN e UP do botao 0, com osk=0/1.
          O teste encerra apos 180 s. O launcher principal nao tem limite.
          A pasta data/ preserva conta, preferencias e cache. NAO apague nem envie dados de login.
          EOF_R36S_KEYS
          cat > 'package/ports/PokeRogue R36S.sh' <<'POKEROGUE_PLAY_EOF'
          #!/bin/bash
          # SPDX-License-Identifier: AGPL-3.0-only
          # PokeRogue R36S experimental - launcher; V5 use the 6 - Teste Teclado script first.
          set -u
          HERE="$(CDPATH='' cd -- "$(dirname -- "$0")" && pwd -P)"
          APP="$HERE/pokerogue-r36s"
          LOG="$APP/ultimo-launcher.txt"
          mkdir -p "$APP/data"
          if [ ! -f "$APP/data/config.txt" ]; then
          cat > "$APP/data/config.txt" <<'CONF'
          # Teste R36S: modo online, teclado interno, audio desativado inicialmente.
          online=1
          osk=1
          fps30=1
          audio=0
          log=1
          CONF
          fi
          {
            echo "==== PokeRogue R36S experimental ===="
            date -u '+UTC: %F %T' || true
            uname -rm
            if [ ! -x "$APP/pokerogue-rt" ]; then
              echo "ERRO: binario ARM64 nao encontrado no pacote: $APP/pokerogue-rt"
              exit 126
            fi
            if [ ! -f "$APP/js/bootstrap.js" ]; then
              echo "ERRO: arquivos JS do runtime nao encontrados em $APP/js"
              exit 126
            fi
            echo 'Dependencias ausentes (se houver):'
            if command -v ldd >/dev/null 2>&1; then ldd "$APP/pokerogue-rt" | grep -E 'not found' || true; fi
            export SDL_VIDEODRIVER=kmsdrm
            export LD_LIBRARY_PATH="$APP/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            export SDL_GAMECONTROLLER_ALLOW_BACKGROUND_EVENTS=1
            echo 'Iniciando runtime em 640x480; arquivos de usuario permanecem em pokerogue-r36s/data.'
            cd "$APP" || exit 1
            ./pokerogue-rt --js "$APP/js" --data "$APP/data" --size 640x480
            status=$?
            echo "pokerogue-rt terminou com codigo $status"
            exit "$status"
          } > "$LOG" 2>&1
          POKEROGUE_PLAY_EOF
          chmod 755 'package/ports/PokeRogue R36S.sh'
          cat > package/INSTRUCOES-PORT.txt <<'POKEROGUE_README_EOF'
          POKEROGUE R36S / dArkOSRE - BUILD V5 (testa tecla Enter sem login)
          =============================================================
          Este ZIP ainda NAO contem o jogo nem um executavel ARM64.
          A compilacao e feita pelo GitHub Actions; o workflow agora gera os lancadores
          por conta propria, sem exigir arquivos na raiz do repositorio.

          COMO USAR:
          1. No repositorio pkrg, abra .github/workflows/build-r36s.yml.
          2. Clique no lapis (Edit) e substitua TODO o conteudo pelo YAML desta versao.
          3. Confirme a alteracao (Commit changes).
          4. Abra Actions > PokeRogue R36S - build ARM64 experimental > Run workflow.
          5. Quando finalizar, em Artifacts, baixe PokeRogue-R36S-v5-teclado.
          6. Extraia o ZIP interno e copie o conteudo de ports/ para ports/ do cartao.
          7. Execute Ports > PokeRogue 6 - Teste Teclado (max 180 segundos).
          8. Envie o status da nova execucao e, se falhar no R36S, o arquivo
             pokerogue-r36s-teclado-v5.txt; revise antes URLs de autenticacao,
             cookies, tokens e dados pessoais. NAO envie localStorage.json ou cookies.json.

          IMPORTANTE:
          - Nao recompila no R36S, nao modifica o firmware.
          - Requer conexao com a internet para modo online.
          - Sucesso do build ainda NAO garante funcionamento do jogo ou do login.
          - Se a etapa de compilacao falhar em outra versao do upstream, envie os
            ultimos 30-50 linhas do passo que falhou.
          - Fonte upstream: https://github.com/krappaU/pokerogue-vita
          - Licenca do runtime: AGPL-3.0.
          POKEROGUE_README_EOF
          # A biblioteca AAC costuma nao estar no firmware; inclua a versao ARM64 do build.
          LIBFAAD="$(ldconfig -p | awk '/libfaad.so.2 / && !seen {path=$NF; seen=1} END {if (seen) print path}')"
          if [ -n "$LIBFAAD" ] && [ -f "$LIBFAAD" ]; then
            cp -L "$LIBFAAD" package/ports/pokerogue-r36s/lib/libfaad.so.2
          fi
          printf 'libfaad2: biblioteca de decodificacao AAC (GPL-2.0-ou-posterior).\nFonte: https://github.com/knik0/faad2\nPacote: libfaad2 do Ubuntu 24.04 ARM64.\n' \
            > package/ports/pokerogue-r36s/lib/ORIGEM-FAAD.txt
          (cd package/ports/pokerogue-r36s && sha256sum pokerogue-rt > SHA256SUMS.txt)
          ldd package/ports/pokerogue-r36s/pokerogue-rt > package/DEPENDENCIAS-BUILD.txt || true
          (cd package && zip -qr ../PokeRogue_R36S_ARM64_EXPERIMENTAL.zip .)

      - name: Upload R36S artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokeRogue-R36S-v5-teclado
          path: PokeRogue_R36S_ARM64_EXPERIMENTAL.zip
          if-no-files-found: error
          retention-days: 14
